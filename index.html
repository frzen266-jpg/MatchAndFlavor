<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Match&Flavor — Digital Dining & Cook-Off Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eceee9;--surface:#fbfbf8;--surface2:#e2e7e1;--ink:#17262b;--muted:#586a6f;--line:#cfd8d3;
  --accent:#1d5c68;--accent-2:#144651;--on-accent:#f4f8f7;--gold:#b8861f;
  --green:#4d7f55;--red:#a8483b;--gray:#c9cdc6;--wood:#c3a272;--wood2:#a98655;
  --shadow:0 1px 2px rgba(23,38,43,.08),0 10px 28px rgba(23,38,43,.07);
  --serif:"PT Serif",Georgia,"Times New Roman",serif;--sans:"PT Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a1d;--surface:#18262a;--surface2:#203136;--ink:#e6eeec;--muted:#93a8ab;--line:#2c4045;
    --accent:#6fb5c2;--accent-2:#8ccad5;--on-accent:#0e1a1d;--gold:#d6a74a;
    --green:#6fa877;--red:#cf7a6c;--gray:#55625f;--wood:#7a5d3c;--wood2:#654c30;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#101a1d;--surface:#18262a;--surface2:#203136;--ink:#e6eeec;--muted:#93a8ab;--line:#2c4045;
  --accent:#6fb5c2;--accent-2:#8ccad5;--on-accent:#0e1a1d;--gold:#d6a74a;
  --green:#6fa877;--red:#cf7a6c;--gray:#55625f;--wood:#7a5d3c;--wood2:#654c30;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.2}
p{margin:0}
button{font-family:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr::after{content:"";display:block;height:6px;background:
  linear-gradient(135deg,var(--gold) 25%,transparent 25%) -6px 0/12px 6px,
  linear-gradient(225deg,var(--gold) 25%,transparent 25%) -6px 0/12px 6px;opacity:.55}
.hdr-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 22px var(--serif)}
.brand b{font:700 20px var(--serif);display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:14px}
.tab{border:0;background:transparent;color:var(--muted);font:700 15px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/20px var(--sans);text-align:center;padding:0 6px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.langs button{border:0;background:transparent;color:var(--muted);font:700 14px var(--sans);padding:9px 12px;cursor:pointer;min-height:40px}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ptschip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700;display:flex;gap:6px;align-items:center;min-height:40px}
.ptschip i{font-style:normal;color:var(--gold)}

/* seat bar */
.seatbar{max-width:1180px;margin:14px auto 0;padding:0 16px}
.seatbar-in{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;box-shadow:var(--shadow)}
.seat-info{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-right:auto;min-width:200px}
.seat-info p{color:var(--muted)}
.seat-info .warn{color:var(--red);font-size:14px;flex-basis:100%}
.dotwalk{width:12px;height:12px;border-radius:50%;background:var(--gray);flex:none}
.seat-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:700 14px var(--sans);padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface2)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.open{background:var(--green)}.dot.private{background:var(--red)}.dot.empty{background:var(--gray)}
.switch{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px 8px 10px;font:700 14px var(--sans);cursor:pointer;display:flex;align-items:center;gap:10px;min-height:40px}
.switch .trk{width:34px;height:20px;border-radius:10px;background:var(--gray);position:relative;transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"] .trk{background:var(--accent)}
.switch[aria-checked="true"] .trk::after{transform:translateX(14px)}
.dndnote{max-width:1180px;margin:8px auto 0;padding:0 16px;color:var(--muted);font-size:14px}

/* buttons */
.btn{font:700 15px/1 var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--muted)}.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn-quiet{background:transparent}
.btn-lg{padding:14px 24px;font-size:17px;min-height:52px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-sm{padding:8px 11px;min-height:36px;font-size:14px}

/* layout */
.main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:14px}
.view-head h1{font-size:28px}
.sub{color:var(--muted);margin-top:4px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block}
.sw.empty{background:var(--gray)}.sw.open{background:var(--green)}.sw.private{background:var(--red)}
.sw.you{border:2px solid var(--accent);background:transparent}

/* floor */
.room{position:relative;border:1px solid var(--line);border-radius:22px;padding:34px 14px 38px;background:
  repeating-linear-gradient(45deg,transparent 0 22px,rgba(184,134,31,.07) 22px 23px),
  repeating-linear-gradient(-45deg,transparent 0 22px,rgba(184,134,31,.07) 22px 23px),var(--surface);box-shadow:var(--shadow)}
.room-label{position:absolute;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px 16px;font-size:13px;color:var(--muted)}
.room-label.top{top:-1px;border-top:0;border-radius:0 0 10px 10px}
.room-label.bottom{bottom:-1px;border-bottom:0;border-radius:10px 10px 0 0}
.floor{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 6px}
.tbl{background:none;border:0;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);border-radius:20px}
.tbl .stage{position:relative;width:132px;height:132px;display:block}
.disc{position:absolute;left:31px;top:31px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font:700 23px/1 var(--serif);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 3px 8px rgba(23,38,43,.2);transition:transform .15s}
.tbl:hover .disc{transform:scale(1.07)}
.disc.empty{background:var(--gray);color:var(--ink)}
.disc.open{background:var(--green);color:#fff}
.disc.private{background:var(--red);color:#fff}
.seat{position:absolute;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1;background:var(--surface);border:2px solid var(--line)}
.seat.off{border-style:dashed;background:transparent;opacity:.65}
.seat.s0{left:51px;top:0}.seat.s1{right:0;top:51px}.seat.s2{left:51px;bottom:0}.seat.s3{left:0;top:51px}
.st-open .seat.on{border-color:var(--green)}.st-private .seat.on{border-color:var(--red)}
.seat.me{border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,92,104,.25)}
.tbl.mine .stage::after{content:"";position:absolute;inset:2px;border:2px solid var(--accent);border-radius:30px;pointer-events:none}
.youtag{position:absolute;right:-2px;bottom:-2px;background:var(--accent);color:var(--on-accent);font:700 12px var(--sans);padding:2px 8px;border-radius:9px;z-index:1}
.cap{font-size:13px;color:var(--muted)}

/* menu */
.menu-layout{display:grid;gap:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:700 14px var(--sans);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dish-art{height:96px;display:grid;place-items:center;font-size:52px;background:var(--surface2)}
.dish-body{padding:12px 14px 6px;flex:1}
.dish-body h3{font-size:18px;margin-bottom:4px}
.dish-body p{color:var(--muted);font-size:14px}
.dish-foot{padding:10px 14px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font:700 17px var(--serif);white-space:nowrap}
.stepper{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:2px}
.stepper button{width:36px;height:36px;border:0;background:var(--surface2);border-radius:9px;font:700 18px var(--sans);color:var(--ink);cursor:pointer}
.stepper span{min-width:26px;text-align:center;font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.panel h2{font-size:21px;margin-bottom:10px}
.cartline{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cartline .nm{flex:1;min-width:0}
.cartline .nm small{display:block;color:var(--muted)}
.rows{margin:12px 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.row.tot{font:700 19px var(--serif);border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.hint{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:12px 0}
.ordl{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;font-size:14px}
.ordl li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--surface2)}
.tag.ok{background:rgba(77,127,85,.18);color:var(--green)}.tag.warn{background:rgba(184,134,31,.2);color:var(--gold)}.tag.bad{background:rgba(168,72,59,.15);color:var(--red)}

/* inbox */
.msgs{display:grid;gap:12px;max-width:760px}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:48px 1fr;gap:4px 12px;box-shadow:var(--shadow)}
.msg.unread{border-color:var(--accent)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:27px;grid-row:span 3}
.msg-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.msg-top b{font-size:16px}
.msg-top small{color:var(--muted)}
.msg-txt{font-size:16px}
.msg-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.paceRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* modal */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,20,23,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:var(--surface);color:var(--ink);border-radius:22px;width:100%;max-width:460px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);border:1px solid var(--line);max-height:calc(100vh - 32px);overflow:auto}
.dlg h2{font-size:23px;margin-bottom:8px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.glist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.guest{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.guest .avatar{width:44px;height:44px;font-size:24px;grid-row:span 2}
.guest .btn{grid-column:2;justify-self:start;margin-top:4px}
.guest small{color:var(--muted)}
.guest .gacts{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.guest .gacts .btn{margin:0}
.sitbanner{background:rgba(184,134,31,.16);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.pay-head{margin:-20px -20px 14px;padding:16px 20px;background:#b8392e;color:#fff;border-radius:22px 22px 0 0;display:flex;gap:12px;align-items:center}
.pay-head b{font:700 20px var(--serif);display:block}
.pay-head small{opacity:.85}
.pay-logo{width:42px;height:42px;border-radius:12px;background:#fff;color:#b8392e;display:grid;place-items:center;font:700 16px var(--sans)}
.qr-wrap{position:relative;width:208px;margin:14px auto 8px;padding:10px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.qr{display:block;width:100%;height:auto}
.qr-wrap.exp .qr{filter:blur(5px) grayscale(1);opacity:.5}
.qr-over{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--serif);color:#17262b;text-align:center;padding:10px}
.center{text-align:center}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);margin:18px auto;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okmark{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:30px;margin:14px auto}

/* toasts */
.toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px;max-width:min(380px,calc(100vw - 24px));pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:15px;animation:tin .25s ease-out;pointer-events:auto}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* game */
.game{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.game.open{display:block}
.g-wrap{max-width:780px;margin:0 auto;padding:14px 16px 40px}
.g-head{display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.g-title{margin-right:auto}
.g-title small{color:var(--muted);font-size:14px;display:block}
.g-title h2{font-size:24px}
.g-steps{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.g-steps li{width:30px;height:8px;border-radius:4px;background:var(--line)}
.g-steps li.done{background:var(--green)}.g-steps li.cur{background:var(--accent)}
.g-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.g-card.center{text-align:center;display:grid;gap:12px;justify-items:center;padding:30px 20px}
.g-emoji{font-size:60px;line-height:1}
.g-desc{max-width:520px;color:var(--muted);font-size:17px}
.score{font:700 64px/1 var(--serif)}
.rating{font:700 22px var(--serif);color:var(--accent)}
.hud{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:16px}
.lbl{color:var(--muted)}
.stage-svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;border-radius:18px;user-select:none;-webkit-user-select:none;touch-action:none}
.bar{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.meter{display:flex;gap:10px;align-items:center;margin-top:12px}
.meter .bar{flex:1}
.gauge{position:relative;height:24px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--green);opacity:.55}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:var(--ink);border-radius:3px}
.gmeta{display:flex;justify-content:space-between;margin-top:6px;font-size:15px}
.actrow{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.asm{display:grid;gap:16px}
.tiles{display:grid;gap:8px}
.tile{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:14px;font:700 16px var(--sans);cursor:pointer;text-align:left;min-height:48px}
.tile:disabled{opacity:.45;cursor:not-allowed}
.tile .sg{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.15)}
.tile .ord{margin-left:auto;background:var(--accent);color:var(--on-accent);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.flip{transform-box:fill-box;transform-origin:center;animation:flipk .45s ease-in-out}
@keyframes flipk{50%{transform:scaleY(.08)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.flame.f2{animation-duration:.37s}.flame.f3{animation-duration:.61s}
@keyframes flick{from{transform:scaleY(.82) scaleX(1.05)}to{transform:scaleY(1.12) scaleX(.94)}}
.sumrows{display:grid;gap:8px;width:100%;max-width:460px;text-align:left}
.sumrow{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;font-size:15px}
.sumrow b{text-align:right}
.quit{position:fixed;inset:0;z-index:70;background:rgba(10,20,23,.6);display:grid;place-items:center;padding:16px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ===== mobile-only layout ===== */
html,body{overscroll-behavior-y:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--line);overflow-x:hidden}
.hdr-in{padding:8px 12px;gap:6px 10px}
.brand small{display:none}
.brand-mark{width:36px;height:36px}
.hdr-r{margin-left:auto;flex-wrap:nowrap}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(480px,100%);z-index:30;border-radius:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);gap:4px;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.tab{flex:1;justify-content:center;min-height:50px;font-size:14px;padding:6px 4px;text-align:center}
.seatbar{padding:0 12px;margin-top:10px}
.seat-info{min-width:0}
.seg button,.switch{font-size:13px}
.main{padding:12px 12px 24px}
.view-head h1{font-size:23px}
.legend{font-size:13px;gap:6px 12px}
.room{padding:30px 6px 34px;border-radius:18px}
.floor{grid-template-columns:repeat(2,1fr)}
.dishes{grid-template-columns:repeat(2,1fr);gap:10px}
.dish-art{height:70px;font-size:40px}
.dish-body{padding:10px 10px 4px}
.dish-body h3{font-size:16px}
.dish-body p{font-size:13px}
.dish-foot{padding:8px 10px 12px;flex-wrap:wrap}
.menu-layout{gap:16px}
.panel.sticky{position:static}
.chips{flex-wrap:nowrap;overflow-x:auto;margin-right:-12px;padding-right:12px;scrollbar-width:none}
.chip{flex:none}
.toasts{left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;max-width:none}
.game{left:50%;right:auto;width:min(480px,100%);transform:translateX(-50%)}
.g-wrap{max-width:480px;padding:12px 12px 40px}
.sumrow{grid-template-columns:92px 1fr 44px}
.dlg{max-width:440px}
.cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(456px,calc(100% - 24px));z-index:25;background:var(--accent);color:var(--on-accent);border:0;border-radius:16px;padding:14px;font:700 16px var(--sans);box-shadow:var(--shadow);min-height:50px}
/* new mini-games */
.stackbox{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-height:84px;background:var(--surface2);border-radius:14px;padding:8px;margin:6px 0 12px;font-size:26px}
.stackbox small{font-size:13px;color:var(--muted)}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font:400 30px var(--sans);color:var(--ink);min-height:86px}
.mcard small{font:700 13px var(--sans)}
.mcard.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--surface2)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pcard{aspect-ratio:1;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 30px var(--sans);cursor:pointer}
.pcard.up{background:var(--surface2);color:var(--ink)}
.pcard.ok{background:var(--green);color:#fff}
.sqgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.sqpad{aspect-ratio:1.4;border:0;border-radius:18px;background:var(--c);font-size:44px;opacity:.55;transition:opacity .1s,transform .1s;cursor:pointer}
.sqpad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,.75)}
.tapbtn{display:grid;place-items:center;width:200px;height:200px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:72px;margin:18px auto 6px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.tapbtn small{font:700 15px var(--sans)}
.tapbtn:active{transform:scale(.94)}

/* ===== compact sizing ===== */
body{font-size:14px;line-height:1.4}
.hdr-in{padding:6px 10px;gap:4px 8px;min-width:0}

.dish-body p{font-size:12px}
.price{font-size:14px}

.qr-wrap{width:170px}

.cartbar{padding:9px;font-size:14px;min-height:42px;bottom:calc(60px + env(safe-area-inset-bottom,0px))}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}

function save(){try{localStorage.setItem('Match&Flavor-v1',JSON.stringify({lang:S.lang,points:S.points}));}catch(e){}}

function t(k,p){
  let s=I18N[S.lang]&&I18N[S.lang][k];
  if(s==null)s=I18N.en[k];
  if(s==null)return k;
  if(p)s=s.replace(/\{(\w+)\}/g,(m,n)=>p[n]!=null?p[n]:m);
  return s;
}
const li=()=>LIDX[S.lang];
function gname(g){return NAMES[g.base][li()]+(g.suffix||'');}

/* ============ guests & tables ============ */
function newGuest(mode){
  const used=new Set();S.tables.forEach(tb=>tb.guests.forEach(g=>used.add(g.base)));
  const pool=NAMES.map((_,i)=>i).filter(i=>!used.has(i));
  let idx,suffix='';
  if(pool.length)idx=pick(pool);else{idx=rint(0,NAMES.length-1);suffix=' '+String.fromCharCode(65+rint(0,25))+'.';}
  return {id:'g'+(S.nextId++),base:idx,suffix,avatar:pick(AVATARS),mode};
}
function seatGroup(tb){
  tb.mode=Math.random()<0.55?'open':'private';
  tb.guests=[];
  const size=pick([1,2,2,3,3,4,4]);
  for(let i=0;i<size;i++)tb.guests.push(newGuest(tb.mode));
}
function initTables(){
  S.tables=[];
  for(let n=1;n<=20;n++)S.tables.push({n,mode:'open',guests:[]});
  shuffle(S.tables.map(x=>x.n)).slice(0,12).forEach(n=>seatGroup(S.tables[n-1]));
}
function tableState(tb){
  if(S.user.table===tb.n)return S.user.status;
  if(!tb.guests.length)return 'empty';
  return tb.mode;
}
function stateLabel(st){return st==='open'?t('legendOpen'):st==='private'?t('legendPrivate'):t('legendEmpty');}
function leaveBlockedNow(){return S.orders.some(o=>o.status!=='served');}

function lifecycle(){
  const now=Date.now();
  if(now<S.nextLifeAt)return;
  S.nextLifeAt=now+rint(18000,35000);
  const occ=S.tables.filter(x=>x.guests.length);
  const free=S.tables.filter(x=>!x.guests.length&&x.n!==S.user.table);
  let fill;
  if(occ.length<=8)fill=true;else if(occ.length>=15||!free.length)fill=false;else fill=Math.random()<0.5;
  if(fill){if(!free.length)return;seatGroup(pick(free));}
  else{if(!occ.length)return;pick(occ).guests=[];}
  render();
}

/* ============ pace ============ */
function gapRange(){return S.pace==='quick'?[8000,14000]:[30000,60000];}
function paceMs(kind){
  const q=S.pace==='quick';
  if(kind==='reply')return q?rint(4000,7000):rint(15000,30000);
  return q?rint(5000,8000):rint(20000,30000);
}

/* ============ messages ============ */
function toast(msg){
  const root=$('#toast-root');
  const el=document.createElement('div');
  el.className='toast';el.textContent=msg;
  root.appendChild(el);
  while(root.children.length>4)root.removeChild(root.firstChild);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},320);},5200);
}
function deliver(m,silent){
  m.id='m'+(S.nextId++);m.ts=Date.now();m.read=(S.tab==='inbox');
  S.inbox.unshift(m);if(S.inbox.length>60)S.inbox.pop();
  if(m.type==='duel'||m.type==='social'||m.type==='reply')S.lastIncomingAt=m.ts;
  if(!silent){
    if(m.type==='duel')toast(t('tNewDuel',{n:m.from.table}));
    else if(m.type==='social')toast(t('tNewMsg',{n:m.from.table}));
    else if(m.type==='reply')toast(t('tReply',{name:gname(m.from)}));
    else if(m.type==='waiter')toast(t(m.textKey,{n:m.table}));
  }
  render();
}
function effStatus(m){
  if((m.type==='duel'||m.type==='reply')&&m.status==='pending'&&Date.now()>m.expiresAt)return 'expired';
  return m.status;
}
function expireMsgs(){
  let ch=false;
  S.inbox.forEach(m=>{if((m.type==='duel'||m.type==='reply')&&m.status==='pending'&&Date.now()>m.expiresAt){m.status='expired';ch=true;}});
  if(ch)render();
}
function maybeInvite(){
  const now=Date.now();
  if(now<S.nextInviteAt)return;
  const gap=gapRange();
  S.nextInviteAt=now+rint(gap[0],gap[1]);
  if(S.dnd||S.user.status!=='open'||G||S.modal)return;
  if(now-S.lastIncomingAt<gap[0]){S.nextInviteAt=Math.max(S.nextInviteAt,S.lastIncomingAt+gap[0]);return;}
  const pend=S.inbox.filter(m=>(m.type==='duel'||m.type==='social')&&effStatus(m)==='pending').length;
  if(pend>=3)return;
  const cands=[];
  S.tables.forEach(tb=>{if(tb.n!==S.user.table&&tb.mode==='open')tb.guests.forEach(g=>cands.push({g,tb}));});
  if(!cands.length)return;
  const c=pick(cands);
  const from={base:c.g.base,suffix:c.g.suffix,avatar:c.g.avatar,table:c.tb.n};
  if(Math.random()<0.5)deliver({type:'duel',from,status:'pending',expiresAt:now+180000});
  else deliver({type:'social',textKey:pick(['s1','s2','s3','s4']),from,status:'pending'});
}
function sendChallenge(gid){
  let tb=null,g=null;
  S.tables.forEach(x=>x.guests.forEach(y=>{if(y.id===gid){tb=x;g=y;}}));
  if(!g){render();return;}
  if(G){toast(t('finishGameFirst'));return;}
  if(S.user.table==null){toast(t('needSeat'));return;}
  if(g.mode!=='open')return;
  if(S.inbox.some(m=>m.type==='out'&&m.status==='pending')){toast(t('pendingChallenge'));return;}
  const out={type:'out',kind:'duel',guestId:gid,to:{base:g.base,suffix:g.suffix,avatar:g.avatar,table:tb.n},fromTable:S.user.table,status:'pending'};
  S.modal=null;
  deliver(out,true);
  toast(t('tChallengeSent',{n:tb.n}));
  setTimeout(()=>resolveChallenge(out),paceMs('reply'));
}
function sendJoin(gid){
  let tb=null,g=null;
  S.tables.forEach(x=>x.guests.forEach(y=>{if(y.id===gid){tb=x;g=y;}}));
  if(!g){render();return;}
  if(G){toast(t('finishGameFirst'));return;}
  if(S.user.table!=null){toast(t('alreadySeated',{n:S.user.table}));return;}
  if(g.mode!=='open')return;
  if(tb.guests.length>=4){toast(t('tableFull'));return;}
  if(S.inbox.some(m=>m.type==='out'&&m.status==='pending')){toast(t('pendingChallenge'));return;}
  const out={type:'out',kind:'join',guestId:gid,to:{base:g.base,suffix:g.suffix,avatar:g.avatar,table:tb.n},fromTable:null,status:'pending'};
  S.modal=null;
  deliver(out,true);
  toast(t('tJoinSent',{n:tb.n}));
  setTimeout(()=>resolveJoin(out),paceMs('reply'));
}
function resolveJoin(out){
  if(out.status!=='pending')return;
  if(S.dnd){setTimeout(()=>resolveJoin(out),4000);return;}
  let g=null;
  S.tables.forEach(x=>x.guests.forEach(y=>{if(y.id===out.guestId)g=y;}));
  const from={base:out.to.base,suffix:out.to.suffix,avatar:out.to.avatar,table:out.to.table};
  if(!g){
    out.status='left';
    deliver({type:'reply',kind:'join',from,result:'left',status:'info'});
    return;
  }
  if(Math.random()>=0.65){
    out.status='declined';
    deliver({type:'reply',kind:'join',from,result:'declined',status:'info'});
    return;
  }
  const tb=S.tables[out.to.table-1];
  if(S.user.table!=null||tb.guests.length>=4||tb.mode!=='open'){
    out.status='expired';
    deliver({type:'reply',kind:'join',from,result:'noroom',status:'info'});
    return;
  }
  out.status='accepted';
  S.user.table=tb.n;
  deliver({type:'reply',kind:'join',from,result:'accepted',status:'info'});
  toast(t('tJoined',{n:tb.n}));
  if(cartLines().length&&!G&&!S.modal)openCheckout();
}
function resolveChallenge(out){
  if(out.status!=='pending')return;
  if(S.dnd){setTimeout(()=>resolveChallenge(out),4000);return;}
  let g=null;
  S.tables.forEach(x=>x.guests.forEach(y=>{if(y.id===out.guestId)g=y;}));
  const from={base:out.to.base,suffix:out.to.suffix,avatar:out.to.avatar,table:out.to.table};
  if(!g){
    out.status='left';
    deliver({type:'reply',from,result:'left',status:'info'});
    return;
  }
  const ok=Math.random()<0.7;
  out.status=ok?'accepted':'declined';
  deliver({type:'reply',from,result:ok?'accepted':'declined',status:ok?'pending':'info',expiresAt:Date.now()+180000});
}

/* ============ orders / waiter ============ */
function startPipeline(orderId){
  const o=S.orders.find(x=>x.id===orderId);
  if(!o||o.pipe)return;
  o.pipe=true;o.status='bringing';
  deliver({type:'waiter',textKey:'waiter1',table:o.table},S.dnd);
  setTimeout(()=>{
    o.status='served';
    deliver({type:'waiter',textKey:'waiter2',table:o.table},S.dnd);
  },paceMs('waiter'));
}

/* ============ cart ============ */
function cartLines(){
  return Object.keys(S.cart).filter(id=>S.cart[id]>0&&MENU_BY_ID[id]).map(id=>({item:MENU_BY_ID[id],qty:S.cart[id]}));
}
function subtotal(){return cartLines().reduce((a,l)=>a+l.item.price*l.qty,0);}
function redeem(){return S.usePoints?Math.min(S.points,Math.floor(subtotal()*0.3)):0;}

  $('#seatbar').innerHTML=`<div class="seatbar-in">${info}<div class="seat-ctrl">
    <div class="seg" role="group"><button data-action="setStatus" data-v="open" aria-pressed="${me.status==='open'}"><span class="dot open"></span>${t('statusOpen')}</button><button data-action="setStatus" data-v="private" aria-pressed="${me.status==='private'}"><span class="dot private"></span>${t('statusPrivate')}</button></div>

/* ============ views ============ */
function floorView(){
  const legend=`<ul class="legend"><li><i class="sw empty"></i>${t('legendEmpty')}</li><li><i class="sw open"></i>${t('legendOpen')}</li><li><i class="sw private"></i>${t('legendPrivate')}</li><li><i class="sw you"></i>${t('legendYou')}</li></ul>`;
  const banner=(S.user.table==null&&cartLines().length)?`<p class="sitbanner">${t('sitBanner')}</p>`:'';
  const tables=S.tables.map(tb=>{
    const st=tableState(tb),mine=S.user.table===tb.n;
    const occ=tb.guests.map(g=>({a:g.avatar,me:false}));
    if(mine)occ.push({a:S.user.avatar,me:true});
    const count=occ.length;
    let seats='';
    for(let i=0;i<4;i++){
      if(occ[i])seats+=`<span class="seat s${i} ${occ[i].me?'me':'on'}">${occ[i].a}</span>`;
      else seats+=`<span class="seat s${i} off"></span>`;
    }
    const label=`${t('tableN',{n:tb.n})}, ${t('seatsCount',{c:count})}, ${stateLabel(st)}${mine?', '+t('legendYou'):''}`;
    return `<button class="tbl st-${st}${mine?' mine':''}" data-action="openTable" data-n="${tb.n}" aria-label="${esc(label)}"><span class="stage">${seats}<span class="disc ${st}">${tb.n}</span>${mine?`<span class="youtag">${t('legendYou')}</span>`:''}</span><span class="cap">${t('seatsCount',{c:count})}</span></button>`;
  }).join('');
  return `<section><div class="view-head"><div><h1>${t('floorTitle')}</h1><p class="sub">${t('floorSub')}</p></div>${legend}</div>${banner}
   <div class="room"><span class="room-label top">${t('kitchen')}</span><div class="floor">${tables}</div><span class="room-label bottom">${t('entrance')}</span></div></section>`;
}
function dishCard(it){
  const q=S.cart[it.id]||0,nm=it.n[li()];
  const ctrl=q>0
   ?`<div class="stepper"><button data-action="dec" data-id="${it.id}" aria-label="${esc(t('qtyDec'))}">−</button><span>${q}</span><button data-action="inc" data-id="${it.id}" aria-label="${esc(t('qtyInc'))}">+</button></div>`
   :`<button class="btn btn-primary btn-sm" data-action="inc" data-id="${it.id}">${t('add')}</button>`;
  return `<article class="dish"><div class="dish-art" aria-hidden="true">${it.emoji}</div><div class="dish-body"><h3>${esc(nm)}</h3><p>${esc(it.d[li()])}</p></div><div class="dish-foot"><b class="price">${fmt(it.price)}</b>${ctrl}</div></article>`;
}
function cartPanel(){
  const lines=cartLines(),sub=subtotal(),red=redeem(),total=sub-red;
  let body;
  if(!lines.length)body=`<p class="empty">${t('cartEmpty')}</p>`;
  else{
    body=lines.map(l=>`<div class="cartline"><div class="nm">${esc(l.item.n[li()])}<small>${fmt(l.item.price)}</small></div><div class="stepper"><button data-action="dec" data-id="${l.item.id}" aria-label="${esc(t('qtyDec'))}">−</button><span>${l.qty}</span><button data-action="inc" data-id="${l.item.id}" aria-label="${esc(t('qtyInc'))}">+</button></div><b>${fmt(l.item.price*l.qty)}</b></div>`).join('');
    body+=`<label class="check"><input type="checkbox" data-action="togglePoints" data-id="pts"${S.usePoints?' checked':''}${S.points<1?' disabled':''}><span>${t('usePoints')}<br><small class="hint">${t('balanceLine',{p:S.points})}</small></span></label>
     <div class="rows"><div class="row"><span>${t('subtotal')}</span><span>${fmt(sub)}</span></div>${red>0?`<div class="row"><span>${t('pointsDiscount')}</span><span>−${fmt(red)}</span></div>`:''}<div class="row tot"><span>${t('total')}</span><span>${fmt(total)}</span></div></div>`;
    if(S.user.table==null)body+=`<p class="hint" style="margin-bottom:10px">${t('seatNeededCart')}</p><button class="btn btn-primary btn-lg" style="width:100%" data-action="goFloor">${t('chooseTable')}</button>`;
    else body+=`<p class="hint" style="margin-bottom:10px">${t('deliveredToTable',{n:S.user.table})}</p><button class="btn btn-primary btn-lg" style="width:100%" data-action="checkout">${t('payQr')} — ${fmt(total)}</button>`;
  }
  const ords=S.orders.slice(-3).reverse().map(o=>`<li><span>${t('orderN',{n:o.id})} · ${t('tableN',{n:o.table})}</span><span class="tag ${o.status==='served'?'ok':'warn'}">${t('os_'+o.status)}</span></li>`).join('');
  return `<aside class="panel sticky" id="cart"><h2>${t('cartTitle')}</h2>${body}${ords?`<h3 style="font-size:16px;margin-top:18px">${t('ordersTitle')}</h3><ul class="ordl">${ords}</ul>`:''}</aside>`;

  const bar=cc?`<button class="cartbar" data-action="toCart">🛒 ${t('cartTitle')} · ${cc} · ${fmt(subtotal())}</button>`:'';

   <div class="dishes">${items.map(dishCard).join('')}</div></div>${cartPanel()}</div></section>${bar}`;

function msgView(m){
  const eff=effStatus(m);
  let avatar,who,tbl,text,chip='',acts='';
  const tm=new Date(m.ts).toLocaleTimeString(S.lang==='en'?'en-GB':'ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(m.type==='waiter'){avatar='🛎️';who=t('waiter');tbl=m.table;text=t(m.textKey,{n:m.table});}
  else if(m.type==='duel'){
    avatar=m.from.avatar;who=gname(m.from);tbl=m.from.table;text=t('duelInvite',{n:m.from.table});
    if(eff==='pending')acts=`<button class="btn btn-primary" data-action="accDuel" data-id="${m.id}">${t('accept')}</button><button class="btn" data-action="decMsg" data-id="${m.id}">${t('decline')}</button>`;
    else chip=`<span class="tag ${eff==='accepted'?'ok':'bad'}">${t('ms_'+eff)}</span>`;
  }else if(m.type==='social'){
    avatar=m.from.avatar;who=gname(m.from);tbl=m.from.table;text=t(m.textKey,{n:m.from.table});
    if(eff==='pending')acts=`<button class="btn btn-primary" data-action="accSocial" data-id="${m.id}">${t('accept')}</button><button class="btn" data-action="decMsg" data-id="${m.id}">${t('decline')}</button>`;
    else chip=`<span class="tag ${eff==='accepted'?'ok':'bad'}">${t('ms_'+eff)}</span>`;
  }else if(m.type==='out'){
    avatar=m.to.avatar;who=gname(m.to);tbl=m.to.table;text=m.kind==='join'?t('joinOut',{n:tbl}):t('duelInvite',{n:m.fromTable});
    chip=`<span class="tag ${m.status==='pending'?'warn':m.status==='accepted'?'ok':'bad'}">${t('ms_'+m.status)}</span>`;
  }else{
    avatar=m.from.avatar;who=gname(m.from);tbl=m.from.table;text=t((m.kind==='join'?'jreply_':'reply_')+m.result,{name:gname(m.from)});
    if(m.kind==='join'){if(m.result==='accepted')chip=`<span class="tag ok">${t('ms_accepted')}</span>`;}
    else if(m.result==='accepted'&&eff==='pending')acts=`<button class="btn btn-green" data-action="startReply" data-id="${m.id}">${t('startDuel')}</button>`;
    else if(m.result==='accepted')chip=`<span class="tag ${eff==='started'?'ok':'bad'}">${t('ms_'+eff)}</span>`;
  }
  const sub=m.type==='out'?`<small>${t('deliveredTo',{n:tbl})}</small>`:`<small>${t('tableN',{n:tbl})}</small>`;
  return `<article class="msg${m.read?'':' unread'}"><div class="avatar" aria-hidden="true">${avatar}</div><div class="msg-top"><b>${esc(who)}</b>${sub}<small>${tm}</small>${chip}</div><p class="msg-txt">${esc(text)}</p>${acts?`<div class="msg-act">${acts}</div>`:''}</article>`;
}

/* ============ modals ============ */
function tableModal(){
  const n=S.modal.n,tb=S.tables[n-1],mine=S.user.table===n;

function qrSvg(seed){
  const N=25,r=rng(seed),m=[];
  for(let y=0;y<N;y++){m.push([]);for(let x=0;x<N;x++)m[y].push(r()<0.48);}
  function finder(ox,oy){for(let dy=0;dy<7;dy++)for(let dx=0;dx<7;dx++){const edge=dx===0||dx===6||dy===0||dy===6,core=dx>=2&&dx<=4&&dy>=2&&dy<=4;m[oy+dy][ox+dx]=edge||core;}}
  finder(0,0);finder(N-7,0);finder(0,N-7);
  for(let i=0;i<8;i++){
    m[7][i]=false;m[i][7]=false;
    m[7][N-8+i]=false;m[i][N-8]=false;
    m[N-8][i]=false;m[N-8+i][7]=false;
  }
  let rects='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])rects+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return `<svg class="qr" viewBox="-1 -1 27 27" shape-rendering="crispEdges" role="img" aria-label="QR"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><g fill="#1c1c1c">${rects}</g></svg>`;
}

function focusKey(){
  const a=document.activeElement;
  if(!a||!a.dataset||!a.dataset.action)return null;
  return a.dataset.action+'|'+(a.dataset.id||a.dataset.n||a.dataset.v||a.dataset.gid||'');
}
function restoreFocus(k){
  if(!k)return;
  const els=document.querySelectorAll('[data-action]');
  for(let i=0;i<els.length;i++){
    const e=els[i];
    if(e.dataset.action+'|'+(e.dataset.id||e.dataset.n||e.dataset.v||e.dataset.gid||'')===k){
      if(e!==document.activeElement){try{e.focus({preventScroll:true});}catch(x){}}
      return;
    }
  }
}

  const fk=(S.modal||G)?null:focusKey();

function doLeave(){

  S.user.table=null;S.modal=null;
  toast(t('tLeft'));render();

function sit(n){
  const tb=S.tables[n-1];
  if(S.user.table!=null||tb.guests.length){render();return;}
  S.user.table=n;S.modal=null;
  toast(t('tSat',{n}));render();

function openCheckout(){
  if(!cartLines().length)return;
  if(S.user.table==null){toast(t('seatNeededCart'));S.tab='floor';render();return;}
  S.pay={phase:'idle',expiresAt:Date.now()+300000,seed:rint(1,999999),expired:false};
  S.modal={type:'checkout'};render();
}
function confirmPay(){
  if(S.pay.phase!=='idle')return;
  if(S.pay.expired||Date.now()>S.pay.expiresAt){S.pay.expired=true;renderModal();return;}
  const lines=cartLines();
  if(!lines.length||S.user.table==null)return;
  S.pay.phase='processing';renderModal();
  setTimeout(()=>{
    const ls=cartLines(),sub=subtotal(),red=redeem(),total=sub-red;
    const top=ls.slice().sort((a,b)=>b.item.price-a.item.price)[0];
    const o={id:S.orderSeq++,dish:top?top.item.id:null,table:S.user.table,lines:ls.map(l=>({id:l.item.id,qty:l.qty})),total,status:'cooking',pipe:false};
    S.orders.push(o);S.points=Math.max(0,S.points-red);S.cart={};S.usePoints=false;save();
    S.pay.phase='success';render();
    setTimeout(()=>{S.modal=null;startGame({mode:'single',orderId:o.id,dish:o.dish});},900);
  },1000);
}

const ING_COLOR={sauce:'#b8432f',mozz:'#f2e6c4',beef:'#7a4a2c',pepperoni:'#a8362b',onion:'#b7739e',basil:'#4f8a3f'};

function pointsFor(acc){return acc>60?50+Math.round((acc-60)*2.5):0;}
function rating(s){return s>=90?'rate_perfect':s>=75?'rate_great':s>=60?'rate_decent':'rate_low';}
function genOpp(){return Math.round(clamp(72+(Math.random()+Math.random()+Math.random()-1.5)*24,48,97));}

function startGame(cfg){
  if(G)return;
  const dish=cfg.dish&&RECIPES[cfg.dish]?cfg.dish:pick(Object.keys(RECIPES));
  G={dish,rec:RECIPES[dish],mode:cfg.mode,opp:cfg.opp||null,orderId:cfg.orderId!=null?cfg.orderId:null,stage:0,phase:'intro',scores:[],fb:[],paused:false,
     oppScore:cfg.mode==='duel'?genOpp():0,cleanup:null,final:null};
  S.modal=null;
  render();renderGame();
}
function stopStage(){if(G&&G.cleanup){const c=G.cleanup;G.cleanup=null;c();}}
function closeGame(abort){
  if(!G)return;
  stopStage();
  const g=G;
  if(abort&&!g.final){
    if(g.orderId!=null)startPipeline(g.orderId);
    toast(t('tQuit'));
  }
  G=null;
  renderGame();render();
}
function finalizeGame(){
  if(!G||G.final)return;
  const acc=Math.round(G.scores.reduce((a,b)=>a+b,0)/G.scores.length);
  const base=pointsFor(acc);
  let outcome=null,pts=base,mult=1;
  if(G.mode==='duel'){
    outcome=acc>G.oppScore?'win':acc===G.oppScore?'draw':'lose';
    if(outcome==='win'){mult=2;pts=base*2;}
    else if(outcome==='lose')pts=0;
  }
  G.final={acc,base,pts,mult,outcome};
  S.points+=pts;save();
  if(G.orderId!=null)startPipeline(G.orderId);
}
function renderGame(){
  const root=$('#game-root');
  if(!G){root.classList.remove('open');root.innerHTML='';return;}
  stopStage();
  root.classList.add('open');
  const cur0=G.rec[G.stage],si=sinfo(cur0),key=cur0.k;
  const dots=G.rec.map((_,i)=>{
    const done=i<G.stage||(i===G.stage&&(G.phase==='result'||G.phase==='final'))||G.phase==='final';
    const cur=!done&&i===G.stage;
    return `<li class="${done?'done':cur?'cur':''}"></li>`;
  }).join('');
  const title=G.phase==='final'?t('resTitle'):si.title;
  const dm=MENU_BY_ID[G.dish],sub=(G.mode==='duel'?t('gameDuel',{name:gname(G.opp)}):t('gameSingle'))+' · '+dm.emoji+' '+dm.n[li()];
  let body='';
  if(G.phase==='intro'){
    body=`<div class="g-card center"><p class="lbl">${t('stageOf',{i:G.stage+1,n:G.rec.length})}</p><div class="g-emoji" aria-hidden="true">${si.e}</div><h3>${si.title}</h3><p class="g-desc">${si.intro}</p><button class="btn btn-primary btn-lg" data-action="gStart" data-af="1">${t('start')}</button></div>`;
  }else if(G.phase==='play'){
    body=`<div class="g-card"><div id="stage-area"></div></div>`;
  }else if(G.phase==='result'){
    const s=G.scores[G.stage],fb=G.fb[G.stage],last=G.stage===G.rec.length-1;
    body=`<div class="g-card center"><p class="lbl">${si.title}</p><div class="score">${s}%</div><div class="rating">${t(rating(s))}</div><p class="g-desc">${t(fb.k,fb.p)}</p><button class="btn btn-primary btn-lg" data-action="gNext" data-af="1">${last?t('seeResults'):t('nextStage')}</button></div>`;
  }else{
    const f=G.final;
    const rows=G.rec.map((s0,i)=>`<div class="sumrow"><span>${sinfo(s0).title}</span><div class="bar"><i style="width:${G.scores[i]}%"></i></div><b>${G.scores[i]}%</b></div>`).join('');
    let lines=`<p class="g-desc">${t('passLine')} — <b>${f.acc>60?t('passed'):t('failed')}</b></p>`;
    if(G.mode==='duel'){
      lines=`<p class="rating">${f.outcome==='win'?t('duelWin'):f.outcome==='draw'?t('duelDraw'):t('duelLose',{name:gname(G.opp)})}</p><p>${t('youVs',{a:f.acc,name:esc(gname(G.opp)),b:G.oppScore})}</p>`+lines;
      if(f.outcome==='win')lines+=`<p class="tag ok">${t('doubleBonus')}</p>`;
      if(f.outcome!=='win')lines+=`<p class="hint">${t('duelNoPts')}</p>`;
    }
    lines+=f.pts>0?`<p class="rating">${t('ptsEarned',{p:f.pts})}</p>`:(G.mode==='duel'&&f.outcome==='lose'?'':`<p class="hint">${t('noPts')}</p>`);
    body=`<div class="g-card center"><p class="lbl">${t('accuracy')}</p><div class="score">${f.acc}%</div><div class="sumrows">${rows}</div>${lines}<button class="btn btn-primary btn-lg" data-action="gBack" data-af="1">${t('backToRestaurant')}</button></div>`;
  }
  root.innerHTML=`<div class="g-wrap"><div class="g-head"><div class="g-title"><small>${esc(sub)}</small><h2>${title}</h2></div><ol class="g-steps" aria-hidden="true">${dots}</ol><button class="btn btn-quiet" data-action="quitAsk">${G.phase==='final'?t('close'):t('quit')}</button></div>${body}</div>
   <div class="quit" id="quit-layer" hidden><div class="dlg" role="alertdialog" aria-labelledby="q-t"><h2 id="q-t">${t('quitTitle')}</h2><p>${G.mode==='duel'?t('quitTextDuel'):t('quitTextSingle')}</p><div class="acts"><button class="btn btn-primary" data-action="quitKeep">${t('keepCooking')}</button><button class="btn" data-action="quitYes">${t('quitYes')}</button></div></div></div>`;
  root.scrollTop=0;
  if(G.paused){const q=$('#quit-layer');if(q)q.hidden=false;}
  if(G.phase==='play')mountStage();
  const g0=G;
  setTimeout(()=>{if(G!==g0||G.paused)return;const b=root.querySelector('[data-af]');if(b)b.focus({preventScroll:true});},350);
}

function loop(fn){
  let id=0,alive=true,last=performance.now();
  function f(now){
    if(!alive)return;
    let dt=Math.min(0.05,(now-last)/1000);last=now;
    if(G&&G.paused)dt=0;
    fn(dt);
    id=requestAnimationFrame(f);
  }
  id=requestAnimationFrame(f);
  return ()=>{alive=false;cancelAnimationFrame(id);};
}
function lerpColor(stops,v){
  for(let i=1;i<stops.length;i++){
    if(v<=stops[i][0]){
      const a=stops[i-1],b=stops[i],k=(v-a[0])/((b[0]-a[0])||1);
      return 'rgb('+a[1].map((c,j)=>Math.round(c+(b[1][j]-c)*k)).join(',')+')';
    }
  }
  return 'rgb('+stops[stops.length-1][1].join(',')+')';
}
function mountStage(){
  const area=$('#stage-area'),g=G,cleanups=[];
  let finished=false;
  const ctx={area,cleanups,cfg:(g.rec[g.stage].c||{}),
    finish(score,fb){
      if(finished)return;finished=true;
      setTimeout(()=>{
        if(G!==g||g.phase!=='play')return;
        stopStage();
        g.scores.push(clamp(Math.round(score),0,100));g.fb.push(fb);g.phase='result';
        renderGame();
      },650);
    }};
  g.cleanup=()=>{cleanups.forEach(f=>{try{f();}catch(e){}});};
  ({dough:mountDough,prep:mountPrep,grill:mountGrill,assembly:mountAssembly,oven:mountOven,stack:mountStack,memory:mountMemory,pairs:mountPairs,seq:mountSeq,gauge:mountGauge,tap:mountTap})[g.rec[g.stage].k](ctx);
}

function mountStack(ctx){
  const area=ctx.area,items=ctx.cfg.items,N=items.length;
  let pos=0,miss=0,lock=false;
  area.innerHTML=`<div class="hud"><div><span class="lbl" id="sk-l"></span></div><div><span class="lbl">${t('gMiss')}</span> <b id="sk-m">0</b></div></div><div class="stackbox" id="sk-box"></div><div class="tiles">${shuffle(items.map((_,i)=>i)).map(i=>`<button class="tile" data-i="${i}"><span style="font-size:24px">${items[i].e}</span>${esc(items[i].n[li()])}</button>`).join('')}</div>`;
  const box=$('#sk-box',area);
  function upd(){$('#sk-l',area).textContent=t('layerN',{i:Math.min(pos+1,N),n:N});$('#sk-m',area).textContent=miss;}
  upd();
  area.addEventListener('click',e=>{
    const b=e.target.closest('.tile');
    if(!b||b.disabled||lock||G.paused)return;
    const i=+b.dataset.i;
    if(i===pos){
      b.disabled=true;
      box.insertAdjacentHTML('beforeend',`<div>${items[i].e} <small>${esc(items[i].n[li()])}</small></div>`);
      pos++;upd();
      if(pos>=N){lock=true;ctx.finish(100*N/(N+miss),{k:'fb_stack',p:{m:miss}});}
    }else{
      miss++;upd();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),320);
    }
  });
}
function mountMemory(ctx){
  const area=ctx.area,set=ctx.cfg.set,N=set.length,all=shuffle(set.concat(ctx.cfg.decoy||[]));
  const sel=new Set(),DUR=4+N*0.6;
  let el=0,picking=false,fin=false;
  area.innerHTML=`<p class="rating" id="mm-h">${t('gMemo')}</p><div class="bar"><i id="mm-b" style="width:100%"></i></div><div class="memgrid" id="mm-g"></div><div class="actrow" id="mm-a"></div>`;
  const g=$('#mm-g',area);
  g.innerHTML=set.map(x=>`<div class="mcard"><span>${x.e}</span><small>${esc(x.n[li()])}</small></div>`).join('');
  const stop=loop(dt=>{
    if(picking)return;
    el+=dt;$('#mm-b',area).style.width=Math.max(0,100*(1-el/DUR))+'%';
    if(el>=DUR)startPick();
  });
  ctx.cleanups.push(stop);
  function head(){$('#mm-h',area).textContent=t('gPick',{c:sel.size,n:N});}
  function startPick(){
    picking=true;stop();
    $('#mm-b',area).parentNode.hidden=true;
    g.innerHTML=all.map((x,i)=>`<button class="mcard pick" data-i="${i}" aria-pressed="false"><span>${x.e}</span><small>${esc(x.n[li()])}</small></button>`).join('');
    $('#mm-a',area).innerHTML=`<button class="btn btn-primary btn-lg" id="mm-d">${t('gDone')}</button>`;
    head();
  }
  area.addEventListener('click',e=>{
    if(!picking||fin)return;
    const b=e.target.closest('.pick');
    if(b){
      const i=+b.dataset.i;
      if(sel.has(i)){sel.delete(i);b.setAttribute('aria-pressed','false');}else{sel.add(i);b.setAttribute('aria-pressed','true');}
      head();return;
    }
    if(e.target.closest('#mm-d')){
      fin=true;
      let c=0,w=0;sel.forEach(i=>{if(set.indexOf(all[i])>=0)c++;else w++;});
      ctx.finish(clamp(100*(c-w*0.5)/N,0,100),{k:'fb_memory',p:{c,n:N}});
    }
  });
}
function mountPairs(ctx){
  const area=ctx.area,es=ctx.cfg.set,P=es.length,deck=shuffle(es.concat(es));
  let first=-1,lock=false,moves=0,found=0;
  area.innerHTML=`<div class="hud"><div><span class="lbl">${t('gMoves')}</span> <b id="pr-m">0</b></div><div><span class="lbl">${t('gFound')}</span> <b id="pr-f">0/${P}</b></div></div><div class="pgrid">${deck.map((e,i)=>`<button class="pcard" data-i="${i}"><span>?</span></button>`).join('')}</div>`;
  area.addEventListener('click',ev=>{
    const b=ev.target.closest('.pcard');
    if(!b||lock||G.paused||b.classList.contains('up')||b.classList.contains('ok'))return;
    const i=+b.dataset.i;
    b.classList.add('up');b.firstChild.textContent=deck[i];
    if(first<0){first=i;return;}
    const a=first;first=-1;moves++;
    $('#pr-m',area).textContent=moves;
    const A=area.querySelector('.pcard[data-i="'+a+'"]');
    if(deck[a]===deck[i]){
      A.classList.add('ok');b.classList.add('ok');found++;
      $('#pr-f',area).textContent=found+'/'+P;
      if(found>=P)ctx.finish(clamp(100-(moves-P)*7,20,100),{k:'fb_pairs',p:{m:moves}});
    }else{
      lock=true;
      setTimeout(()=>{[A,b].forEach(x=>{x.classList.remove('up');x.firstChild.textContent='?';});lock=false;},750);
    }
  });
}
function mountSeq(ctx){
  const area=ctx.area,pads=ctx.cfg.pads||['🧂','🌶️','🧄','🌿'],cols=['#b8432f','#b8861f','#4d7f55','#1d5c68'],R=3;
  let round=0,seq=[],pos=0,ok=0,tot=0,accept=false,dead=false;
  area.innerHTML=`<div class="hud"><div><span class="lbl" id="sq-r"></span></div></div><p class="rating" id="sq-s" style="min-height:30px"></p><div class="sqgrid">${pads.map((p,i)=>`<button class="sqpad" data-i="${i}" style="--c:${cols[i]}">${p}</button>`).join('')}</div>`;
  ctx.cleanups.push(()=>{dead=true;});
  const flash=(i,ms)=>{const e=area.querySelector('.sqpad[data-i="'+i+'"]');if(!e)return;e.classList.add('lit');setTimeout(()=>e.classList.remove('lit'),ms);};
  function next(){
    if(dead)return;
    if(round>=R){ctx.finish(tot?100*ok/tot:0,{k:'fb_seq',p:{c:ok,n:tot}});return;}
    round++;seq=[];
    for(let i=0;i<round+2;i++)seq.push(rint(0,3));
    pos=0;accept=false;tot+=seq.length;
    $('#sq-r',area).textContent=t('gRound',{i:round,n:R});
    $('#sq-s',area).textContent=t('gSeqWatch');
    seq.forEach((v,k)=>setTimeout(()=>{if(!dead)flash(v,450);},800+k*750));
    setTimeout(()=>{if(dead)return;accept=true;$('#sq-s',area).textContent=t('gSeqGo');},800+seq.length*750);
  }
  area.addEventListener('click',e=>{
    const b=e.target.closest('.sqpad');
    if(!b||!accept||G.paused)return;
    const i=+b.dataset.i;flash(i,200);
    if(i===seq[pos]){ok++;pos++;if(pos>=seq.length){accept=false;setTimeout(next,700);}}
    else{accept=false;$('#sq-s',area).textContent='✗';setTimeout(next,900);}
  });
  next();
}
function mountGauge(ctx){

    tt+=dt;
    lvl+=9.2*(1+0.28*Math.sin(tt*2.1)+0.12*Math.sin(tt*5.3))*dt;
    if(lvl>=100){lvl=100;over=true;paint();ctx.finish(0,{k:'fb_ovenBurnt',p:{}});return;}
    paint();
  }));
  paint();
  btn.focus({preventScroll:true});
}

/* ============ timers & init ============ */
function updateQrTimer(){
  if(!S.modal||S.modal.type!=='checkout'||S.pay.phase!=='idle')return;
  const left=S.pay.expiresAt-Date.now();
  if(left<=0){if(!S.pay.expired){S.pay.expired=true;renderModal();}return;}
  const el=$('#qr-timer');if(el)el.textContent=mmss(left);
}
function tick(){
  try{maybeInvite();lifecycle();expireMsgs();updateQrTimer();}catch(e){console.error(e);}
}
function init(){
  load();
  initTables();
  const g=gapRange();
  S.nextInviteAt=Date.now()+rint(g[0],g[1]);
  S.nextLifeAt=Date.now()+rint(18000,35000);
  render();
  setInterval(tick,1000);
}
init();
})();
</script>
